# Matrix table settings: platforms, status columns (platform x milestone),
# sections, and where the web editor commits. Generated by convert_csv.py;
# safe to edit by hand (e.g. add a milestone column or a platform).
title: DEMO Matrix table
jira_url: https://example.atlassian.net/browse/
jira_projects:
  - PROJ
repository:
  name: example-org/example-repo
  branch: matrix-table-demo
  path: matrix-table/data
  tag_prefix: matrix-table/
platforms:
  - id: board-x
    name: Board X
    hardware: Reference board
  - id: board-y
    name: Board Y
    hardware: Partner board
columns:
  - id: soc
    name: SoC
    group: Supported by HW/FW
  - id: board-x-ea
    platform: board-x
    name: EA
  - id: board-x-ga
    platform: board-x
    name: GA
  - id: board-y-beta
    platform: board-y
    name: Beta
  - id: board-y-ga
    platform: board-y
    name: GA
sections:
  - id: A
    name: Kernel
    description: Kernel features
    notes:
      board-x: Section note
      board-y: Section note for Y
  - id: B
    name: Firmware
    description: Firmware features
    notes:
      board-x: Firmware section note
