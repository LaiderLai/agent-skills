name: Matrix Site

on:
  push:
    branches:
      - __DEPLOY_BRANCH__
    # A new version (git tag) re-publishes the site so the snapshot lists it.
    tags:
      - "matrix-table/*"
    paths:
      - "matrix-table/**"
      - ".github/workflows/matrix-site.yml"
  pull_request:
    branches:
      - __DEPLOY_BRANCH__
    paths:
      - "matrix-table/**"
      - ".github/workflows/matrix-site.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Branch whose data is published for tag-triggered runs.
  DEPLOY_BRANCH: __DEPLOY_BRANCH__

concurrency:
  group: matrix-table-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history and tags: every matrix-table/* tag is built as a version.
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && env.DEPLOY_BRANCH || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # No npm dependencies; caching would only add a cache-poisoning risk (zizmor: high).
          package-manager-cache: false

      - name: Validate data files
        run: node matrix-table/tools/build.mjs check

      - name: Build static site
        run: node matrix-table/tools/build.mjs build _site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name != 'pull_request' && (
        github.ref == 'refs/heads/__DEPLOY_BRANCH__' ||
        startsWith(github.ref, 'refs/tags/matrix-table/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
